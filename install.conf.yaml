- defaults:
    link:
      create: true
      relink: true

- clean: ['~']

- link:
    ~/.agents/.skill-lock.json: managed_tools/agents/.skill-lock.json
    ~/.agents/skills: managed_tools/agents/skills

    ~/.aws/config: managed_tools/aws/config

    ~/.claude/settings.json: managed_tools/claude/settings.json
    ~/.claude/skills: managed_tools/agents/skills

    ~/.condarc: managed_tools/conda/condarc

    ~/.dircolors: managed_tools/dircolors-solarized/dircolors.ansi-light

    ~/.gitconfig: managed_tools/git/gitconfig
    ~/.gitconfig.echo: managed_tools/git/gitconfig.echo

    ~/.iterm2:
      if: '[ `uname` = Darwin ]'
      path: managed_tools/iterm2

    ~/.oh-my-zsh: managed_tools/ohmyzsh

    ~/.tmux.conf: managed_tools/tmux/tmux.conf
    ~/.tmux/plugins/tpm: managed_tools/tpm

    ~/.vimrc: managed_tools/vim/vimrc
    ~/.vim/after: managed_tools/vim/after
    ~/.vim/bundle/Vundle.vim: managed_tools/vundle

    ~/.zshrc: managed_tools/zsh/zshrc

    ~/Library/Application Support/Code/User/settings.json:
      if: '[ `uname` = Darwin ]'
      path: managed_tools/vscode/settings.json

- link:
    ~/.oh-my-zsh/custom/themes/bullet-train.zsh-theme:
      path: managed_tools/bullet-train.zsh/bullet-train.zsh-theme

- shell:
  -
    description: Installing RO keyboard layout
    command: if [ "$(uname)" = "Darwin" ] ; then managed_tools/ro-keyboard-layout/install.sh ; fi
    stdin: true
    stdout: true
    stderr: true
  -
    description: Mapping some keys with hidutil
    command: if [ "$(uname)" = "Darwin" ] ; then managed_tools/hidutil/install.sh ; fi
    stdin: true
    stdout: true
    stderr: true
  -
    description: Installing Powerline fonts
    command: managed_tools/powerline-fonts/install.sh
    stdin: true
    stdout: true
    stderr: true
  -
    description: Installing tmux plugins
    command: managed_tools/tpm/bin/install_plugins
    stdin: true
    stdout: true
    stderr: true
  -
    description: Installing Vim plugins
    command: vim +PluginInstall +qall
    stdin: true
    stdout: true
    stderr: true
