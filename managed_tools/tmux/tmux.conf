# Report a 256-color tmux terminal to programs running inside tmux.
set -g default-terminal "tmux-256color"

# Start windows and panes at 1, not 0.
set -g base-index 1
setw -g pane-base-index 1

# Mark the active pane with arrows instead of half-colouring the shared border.
set -g pane-border-indicators arrows

# Renumber windows when some are closed.
set -g renumber-windows on

# Switch to another session instead of detaching when one closes.
set -g detach-on-destroy off

# Enable mouse actions.
set -g mouse on

# Use vi keys in copy mode.
setw -g mode-keys vi

# Point SSH_AUTH_SOCK at a fixed path instead of the agent socket of whichever ssh
# connection attached last, so ssh-agent forwarding keeps working in old panes after a
# reconnect. ~/.ssh/ssh_auth_sock must be a symlink to the current agent socket.
set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set-environment -g SSH_AUTH_SOCK ~/.ssh/ssh_auth_sock

# Pass copies from a tmux over ssh to the macOS clipboard. The remote tmux's terminal is
# this tmux (TERM=tmux-256color), whose terminfo entry lacks clipboard support, so tell
# it copying works there. Then let this tmux accept copies from programs in its panes
# and forward them to iTerm2.
set -as terminal-features 'tmux*:clipboard'
set -s set-clipboard on

# Clean up copied text, so it pastes cleanly into apps without a Nerd Font: strip Nerd
# Font icons (private-use characters), turn the powerline arrows between two prompt
# segments into ›, drop the other arrows, trim the gap they leave after ╭─, and shorten
# the prompt's line of · to ten.
set -s copy-command "perl -CSD -pe 's/[\\x{E000}-\\x{E0AF}\\x{E0B4}-\\x{F8FF}\\x{F0000}-\\x{10FFFD}]//g; s/(?<=[^\\s\\x{B7}\\x{2500}-\\x{257F}]) +[\\x{E0B0}-\\x{E0B3}] +(?=[^\\s\\x{B7}])/ \\x{203A} /g; s/[\\x{E0B0}-\\x{E0B3}]//g; s/^([\\x{2500}-\\x{257F}]+) {2,}/\$1 /; s/\\x{B7}{11,}/\"\\x{B7}\" x 10/ge' | tmux load-buffer -w -"

# Monitor window activity.
setw -g monitor-activity on

# Load catppuccin plugin.
set -g @plugin 'catppuccin/tmux#v2.3.2'
set -g @catppuccin_flavor 'latte'  # latte / frappe / macchiato / mocha
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_ram_icon "\U000F035B "   # nf-md-memory; the default U+EFC5 isn't in MesloLGS NF
# Style pane borders by machine: heavy mauve lines when this tmux was started over ssh,
# double peach lines locally.
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g pane-border-lines heavy
    set -g @catppuccin_pane_border_style "fg=#{@thm_mantle}"
    set -g @catppuccin_pane_active_border_style "fg=#{@thm_mauve}"
} {
    set -g pane-border-lines double
    set -g @catppuccin_pane_border_style "fg=#{@thm_mantle}"
    set -g @catppuccin_pane_active_border_style "fg=#{@thm_peach}"
}
run '~/.tmux/plugins/tmux/catppuccin.tmux'   # load now so -F can expand the modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -ag status-right "#{E:@catppuccin_status_session}"

# Load all other plugins.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-cpu'
run '~/.tmux/plugins/tpm/tpm'

# Split panes with - and \ in the current directory, and open new windows in $HOME.
bind - split-window -c "#{pane_current_path}"
unbind '"'  # Default top-and-bottom split, replaced by -.
bind "\\" split-window -h -c "#{pane_current_path}"
unbind %  # Default side-by-side split, replaced by \.
bind c new-window -c "$HOME"

# In copy mode, select with v and copy with y, as in vim.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Jump between shell prompts in the scrollback with Shift + Up/Down. The prompt marks
# itself (see `POWERLEVEL9K_TERM_SHELL_INTEGRATION`). From the shell, the first jump
# skips the top line of the current two-line prompt. Over ssh, the key goes through to
# the remote tmux, which jumps through its own scrollback.
bind -n S-Up {
    if -F '#{==:#{pane_current_command},ssh}' {
        send-keys S-Up
    } {
        copy-mode
        send-keys -X previous-prompt
        send-keys -X previous-prompt
    }
}
bind -T copy-mode-vi S-Up send-keys -X previous-prompt
bind -T copy-mode-vi S-Down send-keys -X next-prompt
